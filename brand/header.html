<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1500px;height:500px;overflow:hidden;font-family:"Lilita One",sans-serif}
  .bg{position:absolute;inset:0;background:url(bg-header.png) center/cover}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,30,120,0) 0%,rgba(20,30,120,0) 30%,rgba(30,20,130,.55) 62%,rgba(60,20,150,.8) 100%)}
  .logo{position:absolute;right:70px;top:92px;text-align:right}
  h1{margin:0;font-weight:400;font-style:italic;font-size:132px;line-height:.9;color:#fff;letter-spacing:.01em;
     -webkit-text-stroke:5px #16207a;paint-order:stroke fill;text-shadow:0 9px 0 #16207a,0 18px 40px rgba(0,0,0,.35)}
  h1 b{color:#ffd81a;font-weight:400}
  p{margin:22px 0 0;font-size:34px;color:#fff;text-shadow:0 3px 0 #16207a;font-style:italic}
  .tags{margin-top:18px;display:flex;gap:12px;justify-content:flex-end}
  .tags span{padding:9px 18px;border-radius:12px;background:#ffd81a;color:#1a1a2e;font-size:24px;box-shadow:0 5px 0 #c99a00}
  .tags span.s{background:#9b4dff;color:#fff;box-shadow:0 5px 0 #6a24c4}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="logo">
  <h1>POST<b>ROYALE</b></h1>
  <p>Battle royale inside a post. Open the link — drop in.</p>
  <div class="tags"><span>🎁 LOOT</span><span class="s">🌪 STORM</span><span>🏆 LAST ONE STANDING</span></div>
</div>
</body></html>
