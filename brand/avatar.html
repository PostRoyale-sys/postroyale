<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:400px;height:400px;overflow:hidden;font-family:"Lilita One",sans-serif}
  body{background:radial-gradient(circle at 35% 25%,#5fb2ff 0%,#2f6dff 40%,#3a2bd8 75%,#6a24c4 100%)}
  svg{position:absolute;inset:0}
  .t{position:absolute;left:-120px;right:0;top:200px;text-align:center;font-size:122px;font-style:italic;color:#ffd81a;line-height:1;
     -webkit-text-stroke:9px #16207a;paint-order:stroke fill;text-shadow:0 8px 0 #16207a}
</style></head><body>
<svg width="400" height="400" viewBox="0 0 400 400">
  <!-- кольцо шторма -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="#b77bff" stroke-width="10" stroke-dasharray="26 14" opacity=".85"/>
  <!-- кирка по диагонали: рукоять + фиолетовое навершие -->
  <g transform="translate(200 175) rotate(-38)" stroke="#16207a" stroke-width="8" stroke-linejoin="round">
    <rect x="-13" y="-30" width="26" height="190" rx="10" fill="#a8693a"/>
    <rect x="-13" y="70" width="26" height="22" fill="#7a4a26" stroke="none"/>
    <path d="M -128 -38 Q 0 -112 128 -38 L 112 -14 Q 0 -66 -112 -14 Z" fill="#8a5cff"/>
    <path d="M -100 -42 Q 0 -90 100 -42" fill="none" stroke="#c9b4ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="-24" y="-66" width="48" height="50" rx="8" fill="#5b6472"/>
  </g>
</svg>
<div class="t">PR</div>
</body></html>
